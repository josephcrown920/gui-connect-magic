services:
  shared-ai:
    build:
      context: ..
      dockerfile: shared-ai/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - shared-ai-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  shared-ai-data:
